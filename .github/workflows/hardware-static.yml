name: Hardware static validation
on:
  push:
    paths:
      - 'hardware/gpio_check.py'
      - 'tests/test_gpio_check.py'
      - '.github/workflows/hardware-static.yml'
  pull_request:
    paths:
      - 'hardware/gpio_check.py'
      - 'tests/test_gpio_check.py'
      - '.github/workflows/hardware-static.yml'
jobs:
  gpio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check GPIO map
        run: python3 hardware/gpio_check.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
