; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = fac_io_c3

[env:fac_io_c3]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
	arduino-libraries/Ethernet@2.0.2
build_flags =
	-D FAC_IO_PROTOTYPE=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
platform_packages = platformio/toolchain-riscv32-esp@14.2.0+20260121

[env:fac_io_c3_security_test]
extends = env:fac_io_c3
framework = arduino, espidf
platform_packages =
	platformio/toolchain-riscv32-esp@14.2.0+20260121
	platformio/framework-espidf@~4.50505.0
board_build.esp-idf.sdkconfig_path = sdkconfig.fac_io_c3_security_test
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.security_test
board_build.secure_boot_signing_key = ${sysenv.FAC_IO_SECURE_BOOT_SIGNING_KEY}
