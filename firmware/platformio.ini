[platformio]
default_envs = fac_io_c3

[env:fac_io_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D FAC_IO_PROTOTYPE=1
; WARNING: This board target is for firmware development ONLY, not final custom PCB.
; No Ethernet command endpoint or relay control is enabled in this prototype.
